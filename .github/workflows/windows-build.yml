name: Build Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:

    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Backend
        run: |
          pyinstaller steel-slitting-backend.spec

      - name: Copy backend into Electron
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force desktop\backend
          Copy-Item dist\steel-slitting-backend.exe desktop\backend\steel-slitting-backend.exe

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm install

      - name: Build React
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build Windows Installer
        working-directory: desktop
        run: npm run dist:win

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SteelSlittingOptimizer-Windows
          path: |
            desktop/dist/*.exe